name: Publish to OperatorHub catalogs

# Manual trigger. Generates the OLM bundle once (image pinned by digest) and
# opens one PR per catalog:
#   operatorhub  k8s-operatorhub/community-operators            (OperatorHub.io)
#   openshift    redhat-openshift-ecosystem/community-operators-prod (OpenShift/OKD embedded OperatorHub)
# Both pipelines auto-merge once CI passes, provided the PR author is listed as
# a reviewer in operators/hostzero-keycloak-operator/ci.yaml on their main
# branch. The very first PR to a catalog ships that ci.yaml (from hack/olm/)
# and is merged manually by the upstream maintainers.
#
# Required secrets:
#   OPERATORHUB_FORK_OWNER  GitHub user/org that owns the forks of both catalog repos
#                           (community-operators, community-operators-prod).
#                           Defaults to ${{ github.repository_owner }} if unset.
#   OPERATORHUB_PAT         Classic PAT with the `public_repo` and `workflow` scopes.
#                           `workflow` is needed because syncing the fork with
#                           upstream main pushes upstream's .github/workflows files.
#                           A fine-grained PAT does not work for cross-repo PR
#                           creation against the upstream catalog repos.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Operator version to publish (without leading v, e.g. 0.8.0). Defaults to the Helm chart version.'
        required: false
        type: string
      target:
        description: 'Catalog(s) to publish to.'
        required: false
        type: choice
        options:
          - all
          - operatorhub
          - openshift
        default: all
      dry_run:
        description: 'Generate the bundle and upload it as an artifact without opening PRs.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    name: Generate bundle
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(yq '.version' charts/keycloak-operator/Chart.yaml)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${VERSION}"

      - name: Build publish matrix
        id: matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          ALL='[
            {"name":"operatorhub","upstream":"k8s-operatorhub/community-operators","fork_repo":"community-operators"},
            {"name":"openshift","upstream":"redhat-openshift-ecosystem/community-operators-prod","fork_repo":"community-operators-prod"}
          ]'
          if [ "$TARGET" = "all" ]; then
            MATRIX=$(echo "$ALL" | jq -c .)
          else
            MATRIX=$(echo "$ALL" | jq -c --arg t "$TARGET" '[.[] | select(.name == $t)]')
          fi
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Targets: ${MATRIX}"

      # Disconnected OLM installs (oc-mirror) resolve images by digest, so the
      # bundle references the multi-arch index digest instead of the tag.
      # Fails if the release image for this version has not been pushed yet.
      - name: Resolve image digest
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          REPO="ghcr.io/hostzero-gmbh/keycloak-operator"
          DIGEST=$(docker buildx imagetools inspect "${REPO}:v${VERSION}" --format '{{.Manifest.Digest}}')
          echo "ref=${REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image: ${REPO}:v${VERSION} -> ${DIGEST}"

      - name: Generate OLM bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OPERATOR_IMG: ${{ steps.image.outputs.ref }}
        run: |
          make bundle VERSION="$VERSION" OPERATOR_IMG="$OPERATOR_IMG"

      - name: Inject createdAt into CSV
        run: |
          CSV="bundle/manifests/hostzero-keycloak-operator.clusterserviceversion.yaml"
          # operator-sdk emits the current date but using yq normalises formatting.
          CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) yq -i '.metadata.annotations.createdAt = strenv(CREATED_AT)' "$CSV"
          # Both catalogs run the operator in semver mode (see hack/olm/ci.yaml):
          # the upgrade graph is derived from version numbers and a
          # `replaces`/`skips` key in the CSV fails their CI.
          yq -i 'del(.spec.replaces)' "$CSV"

      - name: Validate bundle
        run: ./bin/operator-sdk bundle validate ./bundle --select-optional name=operatorhub

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ steps.version.outputs.version }}
          path: bundle/

  publish:
    name: Open PR (${{ matrix.name }})
    needs: bundle
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.bundle.outputs.matrix) }}
    env:
      VERSION: ${{ needs.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-${{ env.VERSION }}
          path: bundle

      - name: Determine fork owner
        id: fork
        run: |
          OWNER="${{ secrets.OPERATORHUB_FORK_OWNER }}"
          if [ -z "$OWNER" ]; then
            OWNER="${{ github.repository_owner }}"
          fi
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      # Both pipelines reject PRs that are not rebased on upstream main. The
      # sync happens server-side so the runner never clones the catalog's full
      # history (over 1 GB for community-operators-prod). Pushing upstream's
      # .github/workflows files to the fork requires the PAT to have the
      # `workflow` scope.
      - name: Sync fork with upstream main
        env:
          GH_TOKEN: ${{ secrets.OPERATORHUB_PAT }}
        run: gh repo sync "${{ steps.fork.outputs.owner }}/${{ matrix.fork_repo }}" --source "${{ matrix.upstream }}" --branch main --force

      - name: Checkout catalog fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.fork.outputs.owner }}/${{ matrix.fork_repo }}
          ref: main
          path: catalog
          token: ${{ secrets.OPERATORHUB_PAT }}
          fetch-depth: 1

      - name: Create release branch
        working-directory: catalog
        run: git checkout -B "release-keycloak-operator-${VERSION}"

      - name: Copy bundle into catalog
        run: |
          OPERATOR_DIR="catalog/operators/hostzero-keycloak-operator"
          DEST="$OPERATOR_DIR/$VERSION"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r bundle/manifests "$DEST/"
          cp -r bundle/metadata "$DEST/"
          if [ -d bundle/tests ]; then cp -r bundle/tests "$DEST/"; fi
          # First submission to a catalog: ship ci.yaml so later PRs auto-merge.
          if [ ! -f "$OPERATOR_DIR/ci.yaml" ]; then
            cp hack/olm/ci.yaml "$OPERATOR_DIR/ci.yaml"
          fi

      - name: Commit and push branch
        working-directory: catalog
        run: |
          git config user.name "hostzero-bot"
          git config user.email "opensource@hostzero.com"
          git add operators/hostzero-keycloak-operator
          git commit -s -m "operator hostzero-keycloak-operator (${VERSION})"
          git push --force origin HEAD

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.OPERATORHUB_PAT }}
          FORK_OWNER: ${{ steps.fork.outputs.owner }}
        run: |
          # Re-running for the same version force-pushes the branch; the open PR picks it up.
          EXISTING=$(gh api "repos/${{ matrix.upstream }}/pulls?state=open&head=${FORK_OWNER}:release-keycloak-operator-${VERSION}" --jq '.[0].html_url')
          if [ -n "$EXISTING" ]; then
            echo "PR already open, updated in place: ${EXISTING}"
            exit 0
          fi
          gh pr create \
            --repo "${{ matrix.upstream }}" \
            --head "${FORK_OWNER}:release-keycloak-operator-${VERSION}" \
            --base main \
            --title "operator hostzero-keycloak-operator (${VERSION})" \
            --body "Automated release of hostzero-keycloak-operator ${VERSION}. Generated from https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}."
