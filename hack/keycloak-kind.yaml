# Keycloak deployment for Kind cluster testing
# This provides a simple Keycloak instance for e2e tests
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: keycloak
type: Opaque
stringData:
  username: admin
  password: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args:
            - start-dev
            # Legacy (V1) token exchange and the IdP management/permissions
            # endpoint require these preview features; without them the
            # endpoint returns 500. admin-fine-grained-authz is V1 here because
            # the image is pinned to 26.0 (the :v1 suffix only exists in 26.2+).
            - --features=admin-fine-grained-authz,token-exchange
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            # Keep the heap well under the container limit. Without this the
            # JVM sizes it at 70% of the limit and the rest of the process
            # (metaspace, threads, Infinispan off-heap) pushes the container
            # over the limit under the e2e suite's realm churn: OOMKilled.
            - name: JAVA_OPTS_KC_HEAP
              value: "-Xms512m -Xmx1536m"
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
          # The e2e suite creates and deletes dozens of realms in a few
          # minutes. Keycloak was OOM-killed mid-run at 1Gi and once at 2Gi
          # on the CI runner, and the tests in that window failed. The heap
          # is capped above, so the limit now has real headroom.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: keycloak
---
# NodePort service for external access during development
apiVersion: v1
kind: Service
metadata:
  name: keycloak-nodeport
  namespace: keycloak
  labels:
    app: keycloak
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: keycloak
